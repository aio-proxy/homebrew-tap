name: Update Formula

on:
  repository_dispatch:
    types: [aio-proxy-release]
  workflow_dispatch:
    inputs:
      version:
        description: aio-proxy version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-aio-proxy-formula
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  # Present only on the repository_dispatch path: the sha256 of each platform
  # tarball, hashed by the release that published them (aio-proxy's
  # scripts/release.ts). When set, update-formula.rb uses these instead of
  # downloading — see the comment on the wait job for why that matters.
  AIO_PROXY_CHECKSUMS: ${{ toJSON(github.event.client_payload.checksums) }}

jobs:
  # npm's packument is consistent the moment `npm publish` returns, but reads of
  # the tarball itself lag by minutes behind the CDN — per package, not per
  # release. The dispatched checksums keep formula GENERATION off the network, yet
  # `brew install` below genuinely fetches the tarballs, so it would still 404.
  # Gate on availability here, on the cheapest runner, rather than letting a
  # 10x-billed macOS runner fail and need a manual rerun.
  wait:
    name: Wait for npm tarballs
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for every platform tarball to be fetchable
        env:
          # 15 minutes; observed lag is under 10.
          ATTEMPTS: '60'
          DELAY: '15'
        run: |
          set -uo pipefail
          for package in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64; do
            url="https://registry.npmjs.org/@aio-proxy/${package}/-/${package}-${VERSION}.tgz"
            attempt=0
            until [ "${attempt}" -ge "${ATTEMPTS}" ]; do
              attempt=$((attempt + 1))
              # A HEAD is enough to prove the CDN will serve it, and avoids pulling
              # ~120MB per package just to discard it.
              code="$(curl -sSL -o /dev/null -w '%{http_code}' --head --max-time 60 "${url}" || echo 000)"
              if [ "${code}" = '200' ]; then
                echo "${package}: available"
                break
              fi
              if [ "${attempt}" -ge "${ATTEMPTS}" ]; then
                echo "::error::${url} still returns HTTP ${code} after ${ATTEMPTS} attempts" >&2
                exit 1
              fi
              echo "${package}: HTTP ${code} (attempt ${attempt}/${ATTEMPTS}); retrying in ${DELAY}s"
              sleep "${DELAY}"
            done
          done

  test:
    name: Test generated formula (${{ matrix.os }})
    needs: wait
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - run: ruby scripts/update-formula.rb "$VERSION"
      - run: ruby scripts/update-formula_test.rb
      - run: brew install-bundler-gems
      - run: brew style Formula/aio-proxy.rb
      - run: brew audit --strict aio-proxy/tap/aio-proxy
      - run: brew install aio-proxy/tap/aio-proxy
      - run: brew test aio-proxy

  # test already runs the full CI suite (style + audit --strict + install + test on
  # macOS and Linux), so once it passes we commit the regenerated formula straight to
  # main instead of opening a PR that has to be merged by hand. main has no branch
  # protection; if that changes, switch this job back to a create-pull-request +
  # auto-merge flow. The push uses GITHUB_TOKEN, which deliberately does NOT retrigger
  # ci.yml — the validation already happened above.
  commit:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: ruby scripts/update-formula.rb "$VERSION"
      - run: ruby scripts/update-formula_test.rb
      - name: Commit and push formula update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- Formula/aio-proxy.rb; then
            echo "Formula/aio-proxy.rb already at v${VERSION}; nothing to commit."
            exit 0
          fi
          git add Formula/aio-proxy.rb
          git commit -m "chore: update aio-proxy to v${VERSION}"
          git push origin HEAD:main
